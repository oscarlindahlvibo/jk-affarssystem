server {
    listen 80;
    listen [::]:80;
    server_name supabase.jkprojekt.se;

    client_max_body_size 100m;

    access_log /var/log/nginx/supabase.jkprojekt.se.access.log;
    error_log /var/log/nginx/supabase.jkprojekt.se.error.log;

    location ~ ^/(auth|rest|storage|realtime|functions)/v1(?:/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 720s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 720s;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:28000;
    }

    location / {
        return 404;
    }
}
